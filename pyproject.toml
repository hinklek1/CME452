[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cme452"
version = "0.1.0"
description = "Teaching tools for chemical process dynamics and control"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/hinklek1/CME452"

[tool.setuptools.packages.find]
where = ["src"]
